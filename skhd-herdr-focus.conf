# herdr focus-last hotkey (skhd)
#
# Append this line to ~/.config/skhd/skhdrc (install.sh does this for you if the
# binding isn't already present), then: skhd --restart-service
#
# cmd + shift - j  =  jump to the agent that most recently needed attention.
# Rebind to taste; see `man skhd` for the modifier/key syntax.
cmd + shift - j : ~/.local/bin/herdr-focus-last
